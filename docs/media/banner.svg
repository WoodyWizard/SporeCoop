<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SporeCoop - play every stage of Spore together or as rivals">
  <defs>
    <radialGradient id="bg" cx="72%" cy="38%" r="88%">
      <stop offset="0%" stop-color="#252c68"/>
      <stop offset="48%" stop-color="#13193b"/>
      <stop offset="100%" stop-color="#080c1c"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="84%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#3fc7d9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080c1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="18%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#2fd6b5" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ff9a3c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080c1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ee8ff"/>
      <stop offset="50%" stop-color="#9cb0ff"/>
      <stop offset="100%" stop-color="#c39bff"/>
    </linearGradient>
    <linearGradient id="arcCoop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fc7d9" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#74c867" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#b08cff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="arcRivals" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0b44a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ff7a5f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="g0" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#3fc7d9"/>
      <stop offset="100%" stop-color="#11768c"/>
    </radialGradient>
    <radialGradient id="g1" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#74c867"/>
      <stop offset="100%" stop-color="#2c7b38"/>
    </radialGradient>
    <radialGradient id="g2" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#f0b44a"/>
      <stop offset="100%" stop-color="#a86214"/>
    </radialGradient>
    <radialGradient id="g3" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#ff7a5f"/>
      <stop offset="100%" stop-color="#a83226"/>
    </radialGradient>
    <radialGradient id="g4" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#b08cff"/>
      <stop offset="100%" stop-color="#5a39b8"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="1280" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Deep space backdrop -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#nebulaA)"/>
    <rect width="1280" height="360" fill="url(#nebulaB)"/>

    <!-- Subtle starfield -->
    <g fill="#ffffff">
      <circle cx="48" cy="44" r="1.2" opacity="0.45"/>
      <circle cx="118" cy="296" r="1.5" opacity="0.35"/>
      <circle cx="176" cy="64" r="1.0" opacity="0.55"/>
      <circle cx="238" cy="242" r="1.1" opacity="0.30"/>
      <circle cx="312" cy="42" r="1.6" opacity="0.40"/>
      <circle cx="388" cy="318" r="1.1" opacity="0.45"/>
      <circle cx="454" cy="72" r="1.4" opacity="0.55"/>
      <circle cx="496" cy="210" r="0.9" opacity="0.30"/>
      <circle cx="534" cy="128" r="1.5" opacity="0.60"/>
      <circle cx="568" cy="308" r="1.2" opacity="0.40"/>
      <circle cx="622" cy="48" r="1.7" opacity="0.50"/>
      <circle cx="688" cy="144" r="1.1" opacity="0.45"/>
      <circle cx="724" cy="322" r="1.3" opacity="0.55"/>
      <circle cx="776" cy="68" r="1.5" opacity="0.40"/>
      <circle cx="834" cy="298" r="1.0" opacity="0.50"/>
      <circle cx="912" cy="54" r="1.4" opacity="0.65"/>
      <circle cx="958" cy="264" r="1.2" opacity="0.35"/>
      <circle cx="1028" cy="294" r="1.5" opacity="0.50"/>
      <circle cx="1084" cy="42" r="1.1" opacity="0.45"/>
      <circle cx="1146" cy="272" r="1.6" opacity="0.60"/>
      <circle cx="1218" cy="64" r="1.4" opacity="0.55"/>
      <circle cx="1238" cy="228" r="1.7" opacity="0.48"/>
      <circle cx="1192" cy="324" r="1.0" opacity="0.40"/>
      <circle cx="662" cy="88" r="0.8" opacity="0.65"/>
      <circle cx="892" cy="112" r="0.9" opacity="0.50"/>
      <circle cx="1044" cy="198" r="1.1" opacity="0.42"/>
    </g>

    <!-- Sparkle stars -->
    <g fill="#ffe9a8" opacity="0.75">
      <path d="M582 72 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path d="M1214 148 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
      <path d="M906 246 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2z"/>
    </g>

    <!-- Dual evolutionary arcs (Together + Rivals) -->
    <path d="M578,288 Q656,282 742,226 Q816,178 864,166 Q940,148 986,126 Q1064,90 1138,104"
          fill="none" stroke="url(#arcCoop)" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M598,312 Q694,254 770,248 Q842,240 908,196 Q968,144 1044,146 Q1106,148 1168,118"
          fill="none" stroke="url(#arcRivals)" stroke-width="1.8" stroke-opacity="0.7" stroke-dasharray="6 10" stroke-linecap="round"/>

    <!-- Stage 1: Cell -->
    <g>
      <circle cx="642" cy="264" r="30" fill="#3fc7d9" opacity="0.14"/>
      <circle cx="642" cy="264" r="17" fill="url(#g0)"/>
      <circle cx="662" cy="242" r="5.5" fill="#3fc7d9" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="642" y="308" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#5fd9e8">CELL</text>
    </g>

    <!-- Stage 2: Creature -->
    <g>
      <circle cx="746" cy="224" r="36" fill="#74c867" opacity="0.14"/>
      <circle cx="746" cy="224" r="23" fill="url(#g1)"/>
      <circle cx="776" cy="204" r="7.5" fill="#74c867" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="746" y="274" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#8ad87d">CREATURE</text>
    </g>

    <!-- Stage 3: Tribe -->
    <g>
      <circle cx="854" cy="168" r="44" fill="#f0b44a" opacity="0.14"/>
      <circle cx="854" cy="168" r="30" fill="url(#g2)"/>
      <circle cx="896" cy="156" r="10" fill="#f0b44a" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="854" y="226" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#f5c369">TRIBE</text>
    </g>

    <!-- Stage 4: Civilization -->
    <g>
      <circle cx="978" cy="126" r="54" fill="#ff7a5f" opacity="0.14"/>
      <circle cx="978" cy="126" r="40" fill="url(#g3)"/>
      <circle cx="1032" cy="134" r="13" fill="#ff7a5f" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="978" y="192" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#ff947d">CIVILIZATION</text>
    </g>

    <!-- Stage 5: Space + Orbital Ring -->
    <g>
      <circle cx="1136" cy="102" r="72" fill="#b08cff" opacity="0.13"/>
      <ellipse cx="1136" cy="102" rx="82" ry="22" transform="rotate(-18 1136 102)" fill="none" stroke="#d5c2ff" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="1136" cy="102" r="52" fill="url(#g4)"/>
      <circle cx="1194" cy="134" r="16" fill="#2fd6b5" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.8"/>
      <text x="1136" y="182" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#c5a9ff">SPACE &amp; GA</text>
    </g>

    <!-- Brand & Copy -->
    <text x="64" y="136" font-family="Arial Rounded MT Bold, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="78" letter-spacing="-1" fill="#ffffff">Spore<tspan fill="url(#brandGrad)">Coop</tspan></text>
    <text x="68" y="184" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="24" fill="#d8e0fa">Play every stage of Spore together - or as rivals</text>
    <text x="68" y="218" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#95a3cb">one shared world · your own species &amp; paths · co-op Galactic Adventures</text>

    <!-- Feature pills -->
    <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2">
      <rect x="68" y="254" width="112" height="32" rx="16" fill="#2fd6b5" fill-opacity="0.16" stroke="#2fd6b5" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="124" y="274.5" text-anchor="middle" fill="#6ef0d6">TOGETHER</text>

      <rect x="192" y="254" width="92" height="32" rx="16" fill="#ff7a5f" fill-opacity="0.16" stroke="#ff7a5f" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="238" y="274.5" text-anchor="middle" fill="#ff9e8a">RIVALS</text>

      <rect x="296" y="254" width="128" height="32" rx="16" fill="#b08cff" fill-opacity="0.16" stroke="#b08cff" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="360" y="274.5" text-anchor="middle" fill="#ceb8ff">ADVENTURES</text>

      <rect x="436" y="254" width="118" height="32" rx="16" fill="#f0b44a" fill-opacity="0.15" stroke="#f0b44a" stroke-opacity="0.52" stroke-width="1.2"/>
      <text x="495" y="274.5" text-anchor="middle" fill="#f7cb77">2-4 PLAYERS</text>
    </g>

    <!-- Subtle inner border -->
    <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  </g>
</svg>
