; SporeCoop settings (copied to SporebinEP1/mods on first deploy)
[coop]
; your nickname shown to other players (any language; save this file as UTF-8 when you edit it)
name=Player
; host: send your current save to guests when they join (1/0)
share_world=1
; guest: load the host's world automatically when it arrives (1/0)
auto_load_world=1
; host: save the game before sending it, so guests start from the current state (1/0)
save_before_share=1
; host: mirror NPC creatures to guests (1/0)
share_npcs=1
; host: NPC creatures near a partner treat that partner like your own creature (notice, chase, attack) (1/0)
npcs_target_partners=1
; host: the party's DNA (Creature) and food (Cell) grow at the single-player pace: each player's gain counts
; 1/N with N players in the world (1). 0 = every player's gain counts whole (the party evolves N times faster)
dna_pace=1
; how much the log says for problem reports: 0 = the old amount, 1 = a state line every 10 s and the
; players' actions (eating, bodies, votes, joins; about 1 MB per hour), 2 = verbose
log_detail=1

[report]
; when a problem is marked (/bug in the co-op chat, F9 "Report a problem"), a screenshot of the game
; is kept for the report file you send (mods\logs\shots, the newest 5); 0 = no screenshots (1/0)
screenshot=1
