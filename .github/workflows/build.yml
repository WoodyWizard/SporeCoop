# Build and unit tests on every push and pull request; a tag "v*" also builds the release zip and
# publishes it as a GitHub release (notes: the tag's section of CHANGELOG.md). The game tests need
# Spore and run on the developer's machine (tools/lab.py, docs/10-dev-pipeline.md), never here.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      LLVM_MINGW: ${{ github.workspace }}/llvm-mingw
      LLVM_MINGW_VERSION: "20261006"
    steps:
      - uses: actions/checkout@v4
      - name: release tag matches COOP_VERSION and has a CHANGELOG section (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/release_check.sh "$GITHUB_REF_NAME" notes.md
      - name: llvm-mingw toolchain
        run: |
          n=llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64
          curl -sSL -o t.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$n.tar.xz
          tar -xf t.tar.xz && mv $n llvm-mingw
      - name: Pillow (the setup's icon)
        run: python3 -m pip install --user pillow
      - name: build (loader, SporeKit, coop, resources)
        run: make -j4 LLVM_MINGW=$LLVM_MINGW
      - name: unit tests + knowledge check
        run: make test HOSTCXX=clang++
      - name: release zip, update pack, setup
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sporecoop-zip
          path: |
            out/dist/SporeCoop-*.zip
            out/dist/SporeCoop-*.pack
            out/dist/SporeCoopSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # BUG-0784: build provenance attestations (free for public repositories): `gh attestation verify`
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sporecoop-zip
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # the tag must be COOP_VERSION; the notes: exactly this version's section of CHANGELOG.md
          tools/release_check.sh "$GITHUB_REF_NAME" notes.md
          (cd dist && sha256sum SporeCoop-*.zip SporeCoop-*.pack SporeCoopSetup.exe > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/SporeCoop-*.zip dist/SporeCoop-*.pack dist/SporeCoopSetup.exe dist/SHA256SUMS.txt \
            --title "SporeCoop $ver" --notes-file notes.md
      # BUG-0784: a signed build provenance for every release file and for each binary inside the zip,
      # so anyone can check that a file was built by this workflow from the tag:
      #   gh attestation verify <file> --repo WoodyWizard/SporeCoop
      # After the publish and allowed to fail: an attestation problem never blocks a release.
      - name: the binaries inside the zip
        continue-on-error: true
        run: mkdir -p inzip && unzip -q dist/SporeCoop-*.zip -d inzip
      - name: attest the build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SporeCoop-*.zip
            dist/SporeCoop-*.pack
            dist/SporeCoopSetup.exe
            inzip/SporeCoop/steam_api.sporekit.dll
            inzip/SporeCoop/sporekit.dll
            inzip/SporeCoop/mods/coop.dll
